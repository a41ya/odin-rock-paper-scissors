<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <link rel="icon" href="/images/favicon-rps.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  
</head>
<body>
  <div id="gameUI">
    <div id="gameTitle">
      <h1>rock paper scissors</h1>
      <p class="secondaryText">choose your move</p>
    </div>

    <div id="choices">
      <div class="choice" id="rockBtn">
        <img src="images/rock.png" alt="rock">
        <p>rock</p>
      </div>

      <div class="choice" id="paperBtn">
        <img src="images/paper.png" alt="paper">
        <p>paper</p>
      </div>

      <div class="choice" id="scissorsBtn">
        <img src="images/scissors.png" alt="scissors">
        <p>scissors</p>
      </div>
    </div>

    <div id="roundResult">
      <div id="currentRound">
        > round 01
      </div>


      <div id="prevRound">
        <div id="prevRoundCount">
        round 01
        </div>

        <div id="prevRoundHuman">
          you
        </div>

        <div id="prevRoundComputer">
          computer
        </div>

        <div id="result">
          
        </div>
      </div>

      <div id="score">
        <div class="score" id="playerScore">
          0
        </div>

        <div class="score">
          :
        </div>

        <div class="score" id="computerScore">
          0
        </div>
      </div>
    </div>

    <div id="gameLog">
      <details>
        <summary class="secondaryText" id="log"> game log</summary>
        <ul id="logList">
          <li id="logPlug">not a single game has been played yet.</li>
        </ul>
      </details>
    </div>
  </div>
</body>
</html>
